<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Glowing Accent Light -->
  <circle cx="600" cy="120" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="950" cy="200" r="100" fill="#38bdf8" opacity="0.10" filter="url(#glow)"/>

  <!-- Logo Icon -->
  <g transform="translate(100, 75)">
    <!-- Hexagon Forge Base -->
    <polygon points="50,5 95,30 95,80 50,105 5,80 5,30" fill="url(#accent-box)" stroke="url(#glow-grad)" stroke-width="3"/>
    <!-- Lightning Bolt / Hammer Symbol -->
    <path d="M52 25 L35 55 L48 55 L42 85 L65 50 L52 50 Z" fill="url(#glow-grad)"/>
  </g>

  <!-- Title & Headline -->
  <text x="220" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Code<tspan fill="url(#glow-grad)">Shave</tspan>
  </text>
  <text x="225" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Zero-Loss AST Code Context Compressor for AI Agents &amp; LLMs
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(100, 230)">
    <!-- Card 1: 80% Reduction -->
    <rect x="0" y="0" width="220" height="90" rx="12" fill="url(#accent-box)" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700" fill="#38bdf8">~80%</text>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Token Reduction</text>

    <!-- Card 2: Deterministic AST -->
    <rect x="245" y="0" width="220" height="90" rx="12" fill="url(#accent-box)" stroke="#334155" stroke-width="1.5"/>
    <text x="269" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="700" fill="#a78bfa">100% AST</text>
    <text x="269" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Valid Syntax Guarantees</text>

    <!-- Card 3: Zero LLM Cost -->
    <rect x="490" y="0" width="220" height="90" rx="12" fill="url(#accent-box)" stroke="#334155" stroke-width="1.5"/>
    <text x="514" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" fill="#34d399">$0.00</text>
    <text x="514" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Zero LLM Extra Cost</text>

    <!-- Card 4: Local & Private -->
    <rect x="735" y="0" width="245" height="90" rx="12" fill="url(#accent-box)" stroke="#334155" stroke-width="1.5"/>
    <text x="759" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="#f472b6">&lt; 10ms</text>
    <text x="759" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">100% Local Execution</text>
  </g>

  <!-- Footer Tagline -->
  <text x="100" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#64748b">
    $ pip install codeshave &amp;&amp; codeshave pack ./src -o prompt_context.md
  </text>
</svg>
