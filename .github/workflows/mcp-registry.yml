name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for GitHub OIDC authentication
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry via OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          output=$(./mcp-publisher publish server.json 2>&1) || exit_code=$?
          echo "$output"
          if [ "${exit_code:-0}" -ne 0 ]; then
            if echo "$output" | grep -qi "already exists"; then
              echo "Server version is already published on the MCP Registry."
            else
              exit "$exit_code"
            fi
          fi
